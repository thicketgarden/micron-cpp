name: ci

on:
  push:
  pull_request:

jobs:
  # Blocking. The parser's own behaviour, asserted against hand-written cases.
  unit:
    name: unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: pip install --upgrade platformio
      - run: pio test -e native

  # Compiling with nothing but a compiler is the dependency claim, so it is
  # tested rather than asserted. If this job ever needs a framework, a board or
  # another library, the parser has grown a dependency it should not have.
  freestanding:
    name: builds with a bare compiler
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compile the parser alone
        run: c++ -std=c++17 -Wall -Wextra -Wpedantic -c src/Micron.cpp -o /dev/null
      - name: Compile the parity dumper against it
        run: c++ -std=c++17 -Wall -Wextra -I src parity/ours_dump.cpp src/Micron.cpp -o /dev/null

  # BLOCKING. It passes on every compared event, so a divergence is a real
  # regression and not a known disagreement. Never edit the expected output to
  # close a diff: fix the parser, or document a deviation in MICRON.md and
  # exclude it deliberately.
  parity:
    name: parity against NomadNet
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      # urwid is pinned: the reference's field and table path is sensitive to
      # the version, and an unpinned oracle makes the diff non-deterministic.
      - run: pip install nomadnet 'urwid==2.6.16'
      - name: Diff against the reference parser
        run: MICRON_PY=$(which python) bash parity/run_parity.sh

  # NON-BLOCKING, and staged deliberately. The full corpus is 82 real pages from
  # deployed nodes plus NomadNet's own Guide, and the parser does not match it
  # yet. This job reports the number so it can be watched falling. Turning the
  # main build red on a known gap teaches people to ignore red.
  #
  # PROMOTE THIS TO BLOCKING when it reports zero, and delete this comment.
  corpus:
    name: parity against the full corpus (reports a number)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: pip install nomadnet 'urwid==2.6.16'
      - name: Measure against the frozen corpus
        run: MICRON_PY=$(which python) bash parity/run_full_corpus.sh
