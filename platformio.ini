; Host-side test runner. The parser itself needs no PlatformIO and no board:
; see the `freestanding` CI job, which compiles it with a bare c++ call.
;
; src/ is the library's source directory, which is what library.json exports.
; test_build_src pulls it into the test binary; without it the tests link
; against nothing and fail with undefined symbols.
[env:native]
platform = native
build_flags = -std=c++17 -Wall -Wextra -I src
test_build_src = yes
test_framework = unity
lib_compat_mode = off
